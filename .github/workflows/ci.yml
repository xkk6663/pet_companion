name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: 安装测试依赖
        run: pip install -r requirements-dev.txt
      - name: 脱机用例（网关单测 + 设备纯逻辑 host C 用例；gcc 由 runner 自带）
        run: python -m pytest -m "not hil" -q --junitxml=report/pytest.xml
      - name: 归档报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: report/
          if-no-files-found: ignore
